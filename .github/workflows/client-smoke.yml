name: Client smoke (GK)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  smoke:
    name: redis-cli + redis-py smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install redis-tools + redis-py
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq redis-tools python3-redis

      - name: Build release Kore
        run: cargo build --release

      - name: Run client smoke script
        run: scripts/client_smoke.sh 16379
