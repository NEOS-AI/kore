[package]
name = "kore"
version = "0.3.2"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
bytes = "1"
parking_lot = "0.12"
ahash = "0.8"
crossbeam = "0.8"
dashmap = "6"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
num_cpus = "1"
sysinfo = "0.30"
rand = "0.8"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
