[package]
name = "kore-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
kore = { path = ".." }
bytes = "1"
tokio = { version = "1", features = ["rt", "macros"] }

[[bin]]
name = "resp_parse"
path = "fuzz_targets/resp_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "command_dispatch"
path = "fuzz_targets/command_dispatch.rs"
test = false
doc = false
bench = false
